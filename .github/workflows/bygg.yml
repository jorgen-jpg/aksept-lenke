# Henter boligene fra privatmegleren.no, bygger lenkesiden, tester den og publiserer den.
# Bygger omtrent hver time fra morgen til kveld, og når noen endrer noe i repoet.
# Feiler noe, blir forrige versjon av siden liggende, og GitHub sender e-post.
name: Bygg og publiser

on:
  schedule:
    # GitHub hopper ofte over planlagte kjøringer (4 av rundt 30 gikk de første to døgnene).
    # Derfor prøver vi hvert kvarter, og jobben «trenger» stopper forsøket når siden er
    # under 50 minutter gammel. Klokkeslett i UTC: 05–23 norsk vintertid, 06–00 sommertid.
    - cron: "7,22,37,52 4-22 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lenkesiden
  cancel-in-progress: false

jobs:
  trenger:
    # Planlagte forsøk bygger bare når siden er gammel nok. Alt annet bygger alltid.
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      bygg: ${{ steps.sjekk.outputs.bygg }}
    steps:
      - uses: actions/checkout@v7
      - id: sjekk
        run: python3 scripts/trenger_bygg.py

  bygg:
    needs: trenger
    if: needs.trenger.outputs.bygg == 'ja'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      feed: ${{ steps.feed.outputs.kode }}
      gammel: ${{ steps.status.outputs.gammel }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer verktøy
        # Byggemaskinen har det nettleseren trenger fra før. Systempakker hentes bare
        # hvis nettleseren ikke starter, fordi Ubuntu-speilet av og til bruker minutter på dem.
        run: |
          pip install -r requirements.txt
          python -m playwright install --only-shell chromium
          python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()" \
            || python -m playwright install-deps chromium

      - name: Hent boliger fra privatmegleren.no
        id: feed
        run: |
          set +e
          python scripts/fetch_feed.py
          kode=$?
          echo "kode=$kode" >> "$GITHUB_OUTPUT"
          if [ "$kode" != "0" ]; then
            echo "::warning::Fikk ikke hentet nye boliger (kode $kode). Bygger med siste gode data."
          fi

      - name: Finn adressen til siden
        id: pages
        uses: actions/configure-pages@v6

      - name: Gjenbruk bilder fra forrige bygg
        uses: actions/cache@v6
        with:
          path: .cache/img
          key: bilder-${{ github.run_id }}
          restore-keys: bilder-

      - name: Bygg siden
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build.py

      - name: Test siden
        run: python tests/test_site.py

      - name: Sjekk hvor ferske dataene er
        id: status
        run: |
          python -c "import json; s=json.load(open('site/status.json')); print('gammel=' + ('ja' if s['feed_stale'] else 'nei'))" >> "$GITHUB_OUTPUT"

      - name: Lagre nye boligdata i repoet
        if: steps.feed.outputs.kode == '0' && github.ref == 'refs/heads/main'
        run: python scripts/commit_data.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publiser:
    needs: bygg
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  varsle:
    # Siden er publisert med siste gode data, men de er for gamle. Feiler med vilje, så GitHub sender e-post.
    needs: [bygg, publiser]
    if: needs.bygg.outputs.gammel == 'ja'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error::Har ikke klart å hente boliger fra privatmegleren.no på flere timer (siste kode ${{ needs.bygg.outputs.feed }}). Siden viser eldre data. Se README, «Når noe feiler»."
          exit 1
